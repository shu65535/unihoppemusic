<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>MIDI Humanizer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <h1>MIDI Humanizer</h1>
      <button id="helpBtn" type="button" class="help-btn" title="操作方法" aria-label="操作方法">?</button>
    </header>

    <main>
      <section id="view">
        <!-- Cubase風のツールバー。アイコンは 16×16 の線画（stroke は文字色） -->
        <div class="toolbar" role="toolbar" aria-label="ツールバー">
          <span class="tb-group">
            <button id="undoBtn" type="button" class="tb-btn" disabled title="元に戻す（Ctrl+Z）" aria-label="元に戻す">
              <svg viewBox="0 0 16 16"><path d="M5 3 2 6l3 3" /><path d="M2 6h7.5a4 4 0 0 1 0 8H6" /></svg>
            </button>
            <button id="redoBtn" type="button" class="tb-btn" disabled title="やり直し（Ctrl+Y / Ctrl+Shift+Z）" aria-label="やり直し">
              <svg viewBox="0 0 16 16"><path d="m11 3 3 3-3 3" /><path d="M14 6H6.5a4 4 0 0 0 0 8H10" /></svg>
            </button>
            <button id="resetNotes" type="button" class="tb-btn" disabled title="ノートの修正を取り消す" aria-label="ノートの修正を取り消す">
              <svg viewBox="0 0 16 16"><rect x="2.5" y="8" width="6" height="4" stroke-dasharray="1.5 1.2" /><rect x="7.5" y="8" width="6" height="4" /><path d="M10 4.5H4" /><path d="M5.5 3 4 4.5 5.5 6" /></svg>
            </button>
          </span>
          <span class="tb-sep"></span>
          <span class="tb-group">
            <button id="playToggle" type="button" class="tb-btn play" disabled title="再生／停止（Space）" aria-label="再生／停止">
              <svg class="ic-play" viewBox="0 0 16 16"><path class="fill" d="M4 2.5v11l9-5.5z" /></svg>
              <svg class="ic-stop" viewBox="0 0 16 16"><rect class="fill" x="3.5" y="3.5" width="9" height="9" /></svg>
            </button>
            <button id="loopToggle" type="button" class="tb-btn" aria-pressed="false" title="ループ再生" aria-label="ループ再生">
              <svg viewBox="0 0 16 16"><path d="M3 9V7.5A2.5 2.5 0 0 1 5.5 5H12" /><path d="m10 3 2 2-2 2" /><path d="M13 7v1.5a2.5 2.5 0 0 1-2.5 2.5H4" /><path d="m6 13-2-2 2-2" /></svg>
            </button>
          </span>
          <span class="tb-sep"></span>
          <span id="toolGroup" class="tb-group tb-tools" role="radiogroup" aria-label="編集ツール">
            <button type="button" class="tb-btn" data-tool="smart" role="radio" aria-checked="true" title="スマート（1）" aria-label="スマート">
              <svg viewBox="0 0 16 16"><path class="fill" d="M4 1.5v11.5l3-3 2 4.5 1.8-.8-2-4.4H13z" /></svg>
            </button>
            <button type="button" class="tb-btn" data-tool="range" role="radio" aria-checked="false" title="範囲選択（2）" aria-label="範囲選択">
              <svg viewBox="0 0 16 16"><path d="M5.5 2.5h5M5.5 13.5h5M8 2.5v11" /></svg>
            </button>
            <button type="button" class="tb-btn" data-tool="pencil" role="radio" aria-checked="false" title="鉛筆（3）" aria-label="鉛筆">
              <svg viewBox="0 0 16 16"><path d="M10.5 2.5l3 3-8 8H2.5v-3z" /><path d="m9 4 3 3" /></svg>
            </button>
            <button type="button" class="tb-btn" data-tool="eraser" role="radio" aria-checked="false" title="消しゴム（4）" aria-label="消しゴム">
              <svg viewBox="0 0 16 16"><path d="M9.5 2.5 14 7l-6 6H5l-2.5-2.5z" /><path d="m6 6 4.5 4.5" /><path d="M8 13.5h6" /></svg>
            </button>
            <button type="button" class="tb-btn" data-tool="zoom" role="radio" aria-checked="false" title="ズーム（5）" aria-label="ズーム">
              <svg viewBox="0 0 16 16"><circle cx="6.5" cy="6.5" r="4" /><path d="m9.5 9.5 4 4" /></svg>
            </button>
            <button type="button" class="tb-btn" data-tool="line" role="radio" aria-checked="false" title="ライン（6）" aria-label="ライン">
              <svg viewBox="0 0 16 16"><path d="M3 13 13 3" /><circle class="fill" cx="3" cy="13" r="1.6" /><circle class="fill" cx="13" cy="3" r="1.6" /></svg>
            </button>
          </span>
          <span class="tb-sep"></span>
          <span class="tb-group">
            <button id="snapToggle" type="button" class="tb-btn" aria-pressed="false" title="スナップ" aria-label="スナップ">
              <svg viewBox="0 0 16 16"><path d="M2.5 5.5h11M2.5 10.5h11M5.5 2.5v11M10.5 2.5v11" /></svg>
            </button>
            <select id="snapGrid" class="tb-select" title="グリッドの値" aria-label="グリッドの値">
              <option value="1/1">1/1</option>
              <option value="1/2">1/2</option>
              <option value="1/4">1/4</option>
              <option value="1/8">1/8</option>
              <option value="1/16" selected>1/16</option>
              <option value="1/32">1/32</option>
              <option value="1/2T">1/2 3連</option>
              <option value="1/4T">1/4 3連</option>
              <option value="1/8T">1/8 3連</option>
              <option value="1/16T">1/16 3連</option>
              <option value="1/32T">1/32 3連</option>
            </select>
          </span>
          <span id="handTools" class="tb-group hand-tools">
            <span class="tb-sep"></span>
            <button id="toLeft" type="button" class="tb-btn hand-btn left" data-icon="handLeft" aria-pressed="false" title="左手（L）" aria-label="左手"></button>
            <button id="toRight" type="button" class="tb-btn hand-btn right" data-icon="handRight" aria-pressed="false" title="右手（R）" aria-label="右手"></button>
            <span id="articTools" class="hidden">
              <button id="toNormal" type="button" class="tb-btn hand-btn" aria-pressed="false" aria-label="通常（ミュートなし）">N</button>
              <button id="toBrush" type="button" class="tb-btn hand-btn" aria-pressed="false" aria-label="ブラッシング">×</button>
              <button id="toPalm" type="button" class="tb-btn hand-btn" aria-pressed="false" aria-label="パームミュート">PM</button>
            </span>
            <button id="toAuto" type="button" class="tb-btn hand-btn" data-icon="reset" title="自動に戻す（A）" aria-label="自動に戻す"></button>
            <span id="handInfo" class="hand-info"></span>
          </span>
          <span class="tb-sep"></span>
          <span class="tb-group">
            <label id="colorTools" class="tb-label" title="色分け">
              <svg viewBox="0 0 16 16"><path d="M8 2a6 6 0 1 0 0 12c1 0 1.3-.8.8-1.6-.6-.9 0-1.9 1-1.9H12a2 2 0 0 0 2-2C14 4.7 11.3 2 8 2z" /><circle class="fill" cx="5" cy="7" r="1" /><circle class="fill" cx="8" cy="5" r="1" /><circle class="fill" cx="11" cy="7" r="1" /></svg>
              <select id="colorMode" class="tb-select" aria-label="色分け"></select>
            </label>
            <label class="tb-btn tb-check" title="加工前を重ねて表示">
              <input type="checkbox" id="showOriginal" checked />
              <svg viewBox="0 0 16 16"><rect x="2.5" y="2.5" width="8" height="8" stroke-dasharray="2 1.5" /><rect x="5.5" y="5.5" width="8" height="8" /></svg>
            </label>
          </span>
          <!-- 拡大はズームツールと Ctrl+ホイールで操作する（値の保持用に残す） -->
          <input type="range" id="zoom" class="hidden" min="0.02" max="0.6" step="any" value="0.12" />
          <!-- 実行・開く・書き出しは折り返しても離さない -->
          <span class="tb-file">
            <button id="runBtn" type="button" class="primary tb-download tb-run" disabled>ヒューマナイズを実行</button>
            <button id="openFile" type="button" class="primary tb-download" data-icon="open" aria-label="MIDIを開く"></button>
            <input type="file" id="file" accept=".mid,.midi" hidden />
            <button id="download" type="button" class="primary tb-download" disabled title="MIDIを書き出す" aria-label="MIDIを書き出す">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2v8M4.5 6.5 8 10l3.5-3.5M3 13.5h10" /></svg>
            </button>
          </span>
        </div>
        <!-- ピアノロールと、右端（音域のスクロール・縦ズーム）・右下（横ズーム）のバー（Cubase風） -->
        <div class="roll-frame">
        <div id="rollWrap" class="roll-wrap">
          <!-- 小節番号の帯・音高とレーン名の列は、スクロールしても見えるよう重ねて固定表示する -->
          <div class="roll-inner">
            <canvas id="rollCorner" class="roll-corner" width="0" height="0"></canvas>
            <canvas id="rollRuler" class="roll-ruler" width="0" height="0"></canvas>
            <canvas id="rollKeys" class="roll-keys" width="0" height="0"></canvas>
            <canvas id="roll"></canvas>
          </div>
          <!-- 左端の列の下端に固定表示する、CC・ピッチベンドのレーンの作成・設定 -->
          <div id="laneTools" class="lane-tools hidden">
            <button id="laneAdd" type="button" title="コントローラーレーンを作成">＋</button>
            <button id="laneMenu" type="button" title="コントローラーレーン設定">▼</button>
          </div>
          <div id="selBox" class="sel-box hidden"></div>
          <div id="valueTip" class="value-tip hidden"></div>
          <div id="playhead" class="playhead hidden"><i></i></div>
          <div id="emptyMsg" class="empty-msg">MIDIファイルをここにドロップ</div>
        </div>
        <!-- 右端: ノート領域の横に、音域のスクロールバーと縦ズーム（行の高さ）を並べる。位置は app.js がノート領域に合わせる -->
        <div id="vBar" class="v-bar">
          <div id="pitchBar" class="pitch-bar hidden">
            <button id="pitchUp" type="button" class="bar-btn" title="高い音域へ" aria-label="高い音域へ">▲</button>
            <div id="pitchTrack" class="pitch-track"><div id="pitchThumb" class="pitch-thumb"></div></div>
            <button id="pitchDown" type="button" class="bar-btn" title="低い音域へ" aria-label="低い音域へ">▼</button>
            <button id="vZoomOut" type="button" class="bar-btn" title="縦に縮小" aria-label="縦に縮小">−</button>
            <input type="range" id="vZoom" class="v-zoom" min="3" max="24" step="1" value="7" title="縦方向の拡大" aria-label="縦方向の拡大" />
            <button id="vZoomIn" type="button" class="bar-btn" title="縦に拡大" aria-label="縦に拡大">＋</button>
          </div>
        </div>
        <!-- 下端: 横スクロール（ノート領域の幅に合わせる）と横ズーム -->
        <div class="h-bar">
          <span id="hScrollBox" class="h-scroll hidden">
            <button id="scrollLeftBtn" type="button" class="bar-btn" title="前へ" aria-label="前へ">◀</button>
            <span id="hTrack" class="h-track"><span id="hThumb" class="h-thumb"></span></span>
            <button id="scrollRightBtn" type="button" class="bar-btn" title="後へ" aria-label="後へ">▶</button>
          </span>
          <span id="hZoomBox" class="h-zoom hidden">
            <button id="hZoomOut" type="button" class="bar-btn" title="横に縮小" aria-label="横に縮小">−</button>
            <input type="range" id="hZoom" min="0" max="1000" step="1" value="500" title="横方向の拡大" aria-label="横方向の拡大" />
            <button id="hZoomIn" type="button" class="bar-btn" title="横に拡大" aria-label="横に拡大">＋</button>
          </span>
        </div>
        </div>
        <div class="legend">
          <span><i class="sw before"></i>加工前</span>
          <span class="legend-vel"><i class="sw after"></i>加工後（色の濃さ＝ベロシティ）</span>
          <span id="legendParts" class="legend-part legend-parts"></span>
          <span class="legend-hand"><i class="sw left"></i>左手</span>
          <span class="legend-hand"><i class="sw right"></i>右手（明るさ＝ベロシティ）</span>
          <span class="legend-strum"><i class="sw right"></i>↓ ダウン</span>
          <span class="legend-strum"><i class="sw left"></i>↑ アップ</span>
          <span class="legend-strum"><i class="sw single"></i>単音（明るさ＝ベロシティ）</span>
          <span class="legend-strum">× ブラッシング／PM パームミュート</span>
          <span><i class="sw edited"></i>位置・長さを修正したノート</span>
        </div>
        <!-- ヘッダーの「?」で開く操作方法（help.js がモーダルに入れて表示する） -->
        <template id="helpContent">
          <dl class="help-list">
            <dt>モード</dt>
            <dd>設定「一般」のモードで切り替える。MIDI編集：読み込んだMIDI（加工前）のノートを直接編集する（位置・長さ・音高・追加・削除・ノーマライズ）。ヒューマナイズ編集：ヒューマナイズした結果を手直しする（ノートは位置・長さの修正だけ。追加・削除・音高の変更はできない）。MIDI編集で変えてからヒューマナイズ編集に戻すと、ヒューマナイズし直す</dd>
            <dt>ツール</dt>
            <dd>ツールバーで切り替える（1〜6 キー）。スマート：下の「ノート」「レーン」の操作すべて／範囲選択：ドラッグで区間を選ぶ（クリック・Esc で解除）／鉛筆：ピアノのノートの手・ギターの和音のストローク方向の編集、レーンに点を描く（MIDI編集ではノートを追加。クリックでグリッド1つ分、右へドラッグで伸ばす）／消しゴム：レーンの点をクリック・なぞって消す（MIDI編集ではノートを消す）／ズーム：クリックで拡大、Alt+クリックで縮小／ライン：レーンにドラッグで直線（スロープ）を引く</dd>
            <dt>スナップ</dt>
            <dd>ツールバーの # でグリッドへの吸着をオン／オフ、右の欄でグリッドの値（1/1〜1/32・3連）を選ぶ。Shift を押している間はオン／オフが逆になる</dd>
            <dt>再生</dt>
            <dd>Space で再生／停止。上端の小節番号の帯（1小節目と拍子の変わる小節には拍子も表示）をクリック・ドラッグで再生位置を指定（Shift で拍に合わせる）、Ctrl+ドラッグで範囲選択（Ctrl+クリックで解除）。ループ（⟲）をオンにすると、範囲選択の区間をくり返す</dd>
            <dt>ノート</dt>
            <dd>ドラッグで移動、右端のドラッグで長さ変更（スナップに従う）。何も無い所のドラッグで範囲選択し、選択中のノートはまとめて動かせる。Esc で選択解除。位置・長さの修正はノートごとに覚え、パラメータを変えて実行し直してもヒューマナイズ後の位置に足し直す（白枠のノート）。ノートの右クリックでそのノートの修正を、ツールバーの取り消しボタンで選択したノート（選択が無ければすべて）の修正を取り消す。MIDI編集では上下へのドラッグで音高も変わり、ノートの右クリック・Delete キーでノートを消す</dd>
            <dt>左手／右手</dt>
            <dd>ピアノで色分けが「左手／右手」のとき、スマート・鉛筆でノートをクリックすると左手⇔右手を切り替え。ツールバーの L／R をオンにすると、鉛筆でなぞったノートをその手にする。選択して L（左手）／ R（右手）／ A（自動に戻す）キー・ボタン</dd>
            <dt>ストローク方向</dt>
            <dd>ギターで色分けが「方向 ↓↑」のとき、和音（2音以上）をクリックするとダウン⇔アップを切り替え（和音のノートをまとめて変える）。ツールバーの ↓／↑ をオンにすると、鉛筆でなぞった和音をその方向にする。選択して D（ダウン）／ U（アップ）／ A（自動に戻す）キー・ボタン。単音は方向で処理が変わらないため対象外</dd>
            <dt>ミュート奏法</dt>
            <dd>ギターで、ブラッシングの音に「×」、パームミュートの音に「PM」を表示する。選択して N（通常）／ X（ブラッシング）／ P（パームミュート）キー、またはツールバーの N／×／PM で変更（同時に鳴る音をまとめて変える。単音も対象）。ボタンをオンにすると、鉛筆でなぞった音をその奏法にする。A は方向と奏法の両方を判定に戻す</dd>
            <dt>レーン</dt>
            <dd>スマートではクリックで点を追加、点のクリックで選択（Shift+クリックで追加・解除）、点の無い所のドラッグで範囲選択（Shift で追加選択）、点のドラッグで移動、右クリックで削除、Delete キーで選択中の点を削除、Esc で選択解除（点のダブルクリックでステップ⇔スロープを切り替え）。鉛筆・消しゴム・ラインでも描ける。左端のレーン名のクリックで折りたたみ。左下の ＋ でレーンを作成、▼ でレーンの種類の変更・削除。MIDI編集では表示だけ（編集できない）。区間のレーン（ヒューマナイズ編集で、ベロシティの下に常に表示）は、クリックでその区間を範囲選択、ドラッグ・Shift+クリックで複数の区間をまとめて範囲選択（間の区間も含む。範囲選択・ズームのツールではツールのまま使え、範囲選択のツールなら区間に揃えずに選べる）。区間ごとに設定（プリセット・パラメータ・強度）を持ち、範囲を選ぶと先頭の区間の設定を設定欄に読み込む。範囲なしで実行すると、設定欄に出している区間だけ今の設定にし、ほかの区間はそれぞれの設定のまま揺らぎを振り直す。ヒューマナイズのパラメータ・強度・ドラムマップを変えると、値が決まったとき（スライダーは離したとき）に同じ区間（範囲選択があれば範囲内）を揺らぎを変えずに自動で処理し直す。レーン名の右のボタンで区間を結合（範囲選択があれば範囲の中だけ。拍子の変わる位置の境目は消えない）</dd>
            <dt>表示</dt>
            <dd>ノートとベロシティの境目のドラッグでノート領域の高さを変更（ダブルクリックで枠に合わせる）。ノート領域のホイール・右端のスクロールバーで音域を上下に移動。右端の − ＋ とスライダーで縦方向（1音の高さ）、右下で横方向に拡大・縮小。下端のバー・Shift+ホイールで横にスクロール。ホイールを押したままドラッグでつかんでスクロール、Ctrl+ホイール・ズームツールで横方向に拡大・縮小（カーソル位置を基準）</dd>
            <dt>元に戻す</dt>
            <dd>Ctrl+Z で元に戻す、Ctrl+Y / Ctrl+Shift+Z でやり直し（ノートの位置・長さ・レーンの編集が対象。手の修正は対象外）。ノートの編集は実行し直しても戻せるが、レーンの編集は実行し直すと戻せなくなる。MIDI編集の履歴は別に持つ（ノートの移動・追加・削除・ノーマライズ。最大50操作）。MIDI編集で変えてヒューマナイズし直すと、ヒューマナイズ編集の履歴は消える</dd>
          </dl>
        </template>
      </section>

      <aside id="controls">
        <div id="sideResizer" class="side-resizer" title="幅を変更"></div>
        <div class="side-head">
          <span class="side-title">設定</span>
          <!-- 再生ボタン（▶）と紛らわしくないよう、サイドパネルの絵＋矢印のアイコンにする。折りたたみ時は縦書きの「設定」も出す -->
          <button id="sideToggle" type="button" class="side-toggle" aria-expanded="true" title="設定を閉じる" aria-label="設定を閉じる">
            <svg class="side-toggle-icon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
              <rect x="1.5" y="2.5" width="13" height="11" rx="1.5" fill="none" stroke="currentColor"/>
              <line x1="10.5" y1="2.5" x2="10.5" y2="13.5" stroke="currentColor"/>
              <path class="side-toggle-arrow" d="M4.5 5.5 7 8 4.5 10.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span class="side-toggle-label">設定</span>
          </button>
        </div>
        <div class="side-scroll">
          <details class="cat" open>
            <summary>一般</summary>
            <section>
              <!-- ファイルの情報と、ファイルを開いたときのモーダルで選んだ楽器・使用チャンネル（開き直すまで変えない） -->
              <div id="fileInfo" class="info"></div>
            </section>

            <section>
              <label class="row" for="mode"><span class="name" data-desc="MIDI編集：読み込んだMIDI（加工前）のノートを直接編集する。位置・長さ・音高の変更、追加・削除と、ノーマライズ（実演奏やヒューマナイズ済みのデータを、ベタ打ち相当に揃える）ができる。ヒューマナイズ編集：ヒューマナイズした結果を手直しする。MIDI編集で変えてからヒューマナイズ編集に切り替えると、今の設定でヒューマナイズし直す。ファイルを開くとヒューマナイズ編集になる">モード</span>
                <select id="mode" autocomplete="off" disabled>
                  <option value="source">MIDI編集</option>
                  <option value="humanize" selected>ヒューマナイズ編集</option>
                </select>
              </label>
              <!-- 楽器固有の詳細設定（スキーマの cat: 'instrument' のグループと、ドラムマップ）はモーダルで編集する -->
              <div id="playGroup" class="row buttons">
                <button id="openInstParams" type="button">楽器固有の詳細設定…</button>
              </div>
              <!-- モーダルの中身。開くたびにモーダルへ移し、閉じたらボタンの後ろへ戻す -->
              <div id="instPanel" class="hidden">
                <!-- ピアノ・ギター（中のグループは設定を描き直すたびに作り直す） -->
                <div id="instParams"></div>
                <!-- ドラム -->
                <section id="drumMap" class="group"></section>
              </div>
            </section>

            <!-- 試聴の設定（書き出すMIDIには影響しない。値はブラウザに保存） -->
            <details class="group" open>
              <summary>再生</summary>
              <label class="row" for="volume"><span class="head"><span class="name" data-desc="試聴の音量（0 dB が標準、左端は無音）。上げても -1 dB のリミッターで音割れを防ぐ。書き出すMIDIには影響しない">音量</span><span class="val" id="volumeVal"></span></span>
                <input type="range" id="volume" min="-60" max="12" step="0.5" value="0" />
              </label>
            </details>
          </details>

          <!-- ノーマライズ・ヒューマナイズの大項目は、ファイルを開くまで出さない（モードとあわせて syncCatUi で切り替える） -->
          <details id="normCat" class="cat" open>
            <summary>ノーマライズ</summary>
            <div id="normParams"></div>
            <p id="normGridWarn" class="hint warn hidden"></p>
          </details>

          <details id="humanCat" class="cat" open>
            <summary>ヒューマナイズ</summary>
            <section>
              <label class="row" for="intensity"><span class="head"><span class="name" data-desc="ランダムな揺れとタイミングのずれをまとめて増減（強弱の設計は対象外）">パラメータ強度</span><span class="val" id="intensityVal"></span></span>
                <input type="range" id="intensity" min="0" max="2" step="0.05" value="1" />
              </label>
            </section>
            <!-- プリセット・楽器ごとのパラメータは、ファイルを開いて楽器が決まるまで出さない（.file-only） -->
            <section class="file-only">
              <label class="row">プリセット <select id="preset"></select></label>
              <p id="presetMeterWarn" class="hint warn hidden"></p>
              <div class="row buttons">
                <button id="importPreset" type="button" data-icon="open" aria-label="プリセットを開く"></button>
                <button id="overwritePreset" type="button" data-icon="save" aria-label="上書き保存"></button>
                <button id="saveAsPreset" type="button" data-icon="saveAs" aria-label="名前を付けて保存"></button>
                <button id="exportPreset" type="button" data-icon="export" aria-label="プリセットを書き出す"></button>
                <button id="deletePreset" type="button" data-icon="delete" aria-label="削除"></button>
                <input type="file" id="presetFile" accept=".json" hidden />
              </div>
            </section>
            <div id="params" class="file-only"></div>
            <!-- ピアノの設定「「左手／右手」の判定」の欄（一般 > 楽器固有の詳細設定のモーダル）に差し込む（設定を描き直すたびに入れ直す） -->
            <div id="handActions" class="row buttons">
              <button id="clearHands" type="button" data-icon="reset" aria-label="修正内容を削除"></button>
              <button id="rejudgeHands" type="button" data-icon="refresh" aria-label="再判定する"></button>
            </div>
            <!-- ギターの設定「ストロークの方向・奏法」の欄（一般 > 楽器固有の詳細設定のモーダル）に差し込む（同上） -->
            <div id="strumActions" class="row buttons">
              <button id="clearStrums" type="button" data-icon="reset" aria-label="修正内容を削除"></button>
              <button id="rejudgeStrums" type="button" data-icon="refresh" aria-label="再判定する"></button>
            </div>
            <!-- ピアノ・ギターの設定「フレーズ検出」の欄に差し込む（同上） -->
            <div id="phraseActions" class="row buttons">
              <button id="clearPhrases" type="button" data-icon="reset" aria-label="修正内容を削除"></button>
              <button id="redetectPhrases" type="button" data-icon="refresh" aria-label="再検出する"></button>
            </div>
          </details>
        </div>
      </aside>
    </main>

    <div id="dropOverlay" class="drop-overlay hidden"><p>ドロップしてMIDIファイルを読み込み</p></div>

    <script src="js/core/midi-io.js"></script>
    <script src="js/core/rng.js"></script>
    <script src="js/core/timing.js"></script>
    <script src="js/core/analysis.js"></script>
    <script src="js/core/chords.js"></script>
    <script src="js/core/hands.js"></script>
    <script src="js/core/quantize.js"></script>
    <script src="js/core/edit.js"></script>
    <script src="js/core/strums.js"></script>
    <script src="js/core/analyze.js"></script>
    <script src="js/core/source.js"></script>
    <script src="presets/_bundle.js"></script>
    <script src="js/presets.js"></script>
    <script src="js/drum-map.js"></script>
    <script src="js/humanizers/piano.js"></script>
    <script src="js/humanizers/guitar.js"></script>
    <script src="js/humanizers/drums.js"></script>
    <script src="js/humanizers/pipeline.js"></script>
    <script src="js/normalizer.js"></script>
    <script src="js/core/source-edit.js"></script>
    <script src="js/ui/icons.js"></script>
    <script src="js/ui/modal.js"></script>
    <script src="js/ui/load-dialog.js"></script>
    <script src="js/ui/preview.js"></script>
    <!-- サウンドフォントの音色の一覧（node tools/build-sf2.js で生成。無ければ試聴は簡易シンセ） -->
    <script src="sf2/_built/index.js"></script>
    <script src="js/ui/sf2.js"></script>
    <script src="js/ui/player.js"></script>
    <script src="js/ui/drum-map-ui.js"></script>
    <script src="js/ui/lanes.js"></script>
    <script src="js/ui/help.js"></script>
    <script src="js/ui/app.js"></script>
  </body>
</html>
